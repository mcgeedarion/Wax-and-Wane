name: CI

on:
  pull_request:
  push:
    branches: [main, work]

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - name: Check Python syntax
        run: python -m py_compile python/Sources/*.py
      - name: Run flake8 linting
        run: |
          pip install flake8
          flake8 python/Sources/ --max-line-length=100 --ignore=E501,W503

  python-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip black
      - name: Check Python formatting
        run: black --check --line-length=100 python/Sources/ python/Tests/

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest opencv-python numpy
      - run: python -m pytest python/Tests/ -v

  swift-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cd swift && swift test
      - run: cd swift && swift build -c release
      - run: cd swift && .build/release/wax-and-wane print-default-config >/tmp/wax-and-wane.config.json
      - run: cd swift && .build/release/wax-and-wane validate-config ../examples/config.json
